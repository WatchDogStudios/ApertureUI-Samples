name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions: { contents: read }
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      # The gitleaks CLI, not its action: the action needs a paid licence key on an organisation repository, and a
      # pull request from a fork gets no secrets. The download is verified against the release's published checksum.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: python -W error -m unittest discover -s tools -p "test_*.py" -v
      - run: python tools/check_headers.py .
      - run: python tools/forbidden_scan.py .
      - run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 2 .
