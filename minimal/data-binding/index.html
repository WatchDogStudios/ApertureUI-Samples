<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Binding</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #18201e; color: #eff4ef; font: 20px sans-serif; }
    main { width: min(560px, 86vw); }
    .bar { height: 18px; margin: 12px 0 28px; background: #34423d; }
    .bar-fill { height: 100%; background: #9ada78; }
    .low { color: #ff927e; }
    .status { color: #b4c4bc; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome, <span data-bind-value="{{player.name}}"></span></h1>
    <p>Level <strong data-bind-value="{{player.level}}"></strong></p>
    <p class="status" data-bind-class="{low: {{player.health < 30}}}">
      Health: <span data-bind-value="{{player.health}}"></span>%
    </p>
    <div class="bar"><div class="bar-fill" data-bind-style-width="{{player.health + '%'}}"></div></div>
    <p data-bind-if="{{player.alive}}">Player is active</p>
  </main>
</body>
</html>
